const names=['치킨 속 강아지','머핀 속 강아지','걸레 속 강아지','빵 속 강아지','최종 혼합 챌린지'];
let current=0,unlocked=0,selected=true,answers=[],graded=false;
function choose(v){selected=v;document.getElementById('dog').classList.toggle('on',v);document.getElementById('no').classList.toggle('on',!v);document.getElementById('dog').setAttribute('aria-pressed',v);document.getElementById('no').setAttribute('aria-pressed',!v)}
function render(){graded=false;answers=Array(16).fill(null);document.getElementById('subtitle').textContent='LEVEL '+(current+1)+' / 5';document.getElementById('title').textContent=names[current];document.getElementById('desc').textContent=current===4?'네 가지 유형이 섞여 있어요. 지금까지 배운 특징을 활용하세요.':'사진을 관찰하고 모든 칸에 정답 스티커를 붙이세요.';document.getElementById('result').className='result';document.getElementById('next').hidden=true;document.getElementById('levels').innerHTML=names.map((n,i)=>`<button class="level ${i===current?'active':''}" ${i>unlocked?'disabled':''} onclick="openLevel(${i})">LEVEL ${i+1}</button>`).join('');document.getElementById('grid').innerHTML=DATA[current].map((v,i)=>`<button class="tile" id="t${i}" onclick="stick(${i})" aria-label="${i+1}번 사진, 레이블 붙이기"><img src="${v.img}" alt="분류할 사진 ${i+1}" loading="lazy"><span class="mark" hidden></span></button>`).join('');update()}
function stick(i){if(graded)return;answers[i]=selected;let el=document.getElementById('t'+i);el.className='tile '+(selected?'dog':'no');let m=el.querySelector('.mark');m.hidden=false;m.textContent=selected?'🐶 강아지':'✕ 아님';update()}
function update(){let n=answers.filter(x=>x!==null).length;document.getElementById('count').textContent=n+' / 16개 완료';document.getElementById('fill').style.width=(n/16*100)+'%';document.getElementById('check').disabled=n!==16||graded}
function grade(){if(answers.some(x=>x===null))return;graded=true;let score=0;DATA[current].forEach((item,i)=>{let ok=item.dog===answers[i];if(ok)score++;let t=document.getElementById('t'+i);t.classList.add(ok?'correct':'wrong');t.querySelector('.mark').textContent=(ok?'✓ ':'✕ ')+(item.dog?'강아지':'아님')});let r=document.getElementById('result');r.className='result show';r.innerHTML=`<b>${score} / 16개 정답 · 정확도 ${Math.round(score/16*100)}%</b><p>${score===16?'모든 사진을 정확하게 분류했어요!':'빨간 테두리를 확인해 보세요. 어떤 특징 때문에 헷갈렸나요?'}</p>`;if(current<4){unlocked=Math.max(unlocked,current+1);document.getElementById('next').hidden=false}else{r.innerHTML+='<p><b>5레벨 완료!</b> 정확하고 다양한 데이터가 필요한 이유를 한 문장으로 설명해 보세요.</p>'}update();document.getElementById('levels').innerHTML=names.map((n,i)=>`<button class="level ${i===current?'active':''}" ${i>unlocked?'disabled':''} onclick="openLevel(${i})">LEVEL ${i+1}</button>`).join('')}
function openLevel(i){if(i<=unlocked){current=i;render()}}function next(){if(current<4){current++;render();window.scrollTo({top:0,behavior:'smooth'})}}render();
</script></body></html>
